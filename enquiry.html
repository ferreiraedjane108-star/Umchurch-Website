<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMchurch - Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>UMchurch</h1>
        <p>A Christian Community in Cape Town - Welcome Home</p>
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="services.html">Services</a> |
            <a href="enquiry.html">Enquiry</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Get In Touch</h2>
        <p>Have a question, prayer request, or want to volunteer? Fill out the form below.</p>
        
        <form action="#" method="post">
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="subject">Subject:</label><br>
            <select id="subject" name="subject">
                <option value="volunteer">Volunteering</option>
                <option value="donation">Donation</option>
                <option value="prayer">Prayer Request</option>
                <option value="general">General Enquiry</option>
            </select><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" required></textarea><br><br>

            <input type="submit" value="Send Enquiry">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 UMchurch. All rights reserved.</p>
        <p>Cape Town, South Africa</p>
    </footer>

</body>
</html>
